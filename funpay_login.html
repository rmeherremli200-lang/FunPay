<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Войти / FunPay</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  background: #f5f5f5;
  color: #333;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

a { text-decoration: none; color: inherit; }

/* ── HEADER ── */
header {
  background: #fff;
  border-bottom: 1px solid #e0e0e0;
}

.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo {
  display: flex;
  align-items: center;
  font-size: 21px;
  font-weight: 900;
  color: #1a1a1a;
  letter-spacing: -0.5px;
  flex-shrink: 0;
}

.logo-bolt {
  color: #2196f3;
  font-style: normal;
  font-size: 19px;
  position: relative;
  top: -1px;
}

.search-row {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #999;
  font-size: 14px;
}

.search-row svg { color: #aaa; }

.header-spacer { flex: 1; }

.hamburger {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 4px;
}
.hamburger span {
  display: block;
  width: 22px;
  height: 2px;
  background: #666;
  border-radius: 2px;
}

/* ── PAGE BODY ── */
.page-body {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 16px 60px;
}

/* ── LOGIN BOX ── */
.login-box {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 4px;
  width: 100%;
  max-width: 400px;
  padding: 28px 32px 32px;
}

/* Tabs */
.tabs {
  display: flex;
  align-items: baseline;
  gap: 20px;
  margin-bottom: 18px;
  border-bottom: 1px solid #e0e0e0;
  padding-bottom: 14px;
}

.tab-login {
  font-size: 20px;
  font-weight: 700;
  color: #222;
  cursor: pointer;
}

.tab-register {
  font-size: 20px;
  font-weight: 400;
  color: #2196f3;
  cursor: pointer;
}

.tab-register:hover { text-decoration: underline; }

/* Social */
.social-label {
  font-size: 13px;
  color: #555;
  margin-bottom: 12px;
}

.social-buttons {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.social-btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 1.5px solid #ddd;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s;
  text-decoration: none;
}

.social-btn:hover {
  border-color: #bbb;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

/* Google icon SVG */
.google-icon { width: 26px; height: 26px; }

/* VK */
.vk-btn {
  background: #0077ff;
  border-color: #0077ff;
}

.vk-icon {
  width: 28px;
  height: 28px;
  fill: #fff;
}

/* Divider */
.or-divider {
  font-size: 13px;
  color: #555;
  margin-bottom: 14px;
}

/* Inputs */
.input-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
}

.input-group input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 14px;
  color: #333;
  outline: none;
  transition: border-color 0.2s;
  background: #fff;
}

.input-group input::placeholder { color: #aaa; }
.input-group input:focus { border-color: #2196f3; }

/* Forgot */
.forgot {
  font-size: 13px;
  color: #2196f3;
  display: inline-block;
  margin-bottom: 14px;
}
.forgot:hover { text-decoration: underline; }

/* Cloudflare captcha block */
.cf-block {
  background: #222;
  border-radius: 4px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.cf-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.cf-check {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #27ae60;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.cf-check svg { width: 16px; height: 16px; }

.cf-success {
  font-size: 14px;
  color: #fff;
  font-weight: 500;
}

.cf-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}

.cf-logo {
  display: flex;
  align-items: center;
  gap: 5px;
}

/* Cloudflare orange cloud */
.cf-cloud { font-size: 18px; }

.cf-name {
  font-size: 13px;
  font-weight: 700;
  color: #f38020;
  letter-spacing: 0.5px;
}

.cf-links {
  display: flex;
  gap: 6px;
}

.cf-links a {
  font-size: 10px;
  color: #888;
  text-decoration: underline;
}

/* Login button */
.btn-login {
  width: 100%;
  padding: 13px;
  background: #2196f3;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  letter-spacing: 0.2px;
}

.btn-login:hover { background: #1976d2; }

/* ── FOOTER ── */
footer {
  background: #fff;
  border-top: 1px solid #e0e0e0;
  padding: 22px 20px;
}

.footer-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 40px;
  flex-wrap: wrap;
}

.footer-copy {
  font-size: 13px;
  color: #333;
}

.footer-links {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.footer-links a {
  font-size: 12px;
  color: #2196f3;
}

.footer-links a:hover { text-decoration: underline; }

.footer-spacer { flex: 1; }

.footer-social {
  display: flex;
  align-items: center;
  gap: 16px;
}

.footer-social a {
  color: #555;
  display: flex;
  align-items: center;
  transition: color 0.2s;
}

.footer-social a:hover { color: #222; }

.footer-social svg { width: 22px; height: 22px; }

.footer-artlebedev {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.al-badge {
  border: 1.5px solid #333;
  padding: 4px 8px;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1px;
  color: #222;
  font-family: 'Courier New', monospace;
}

.al-year { font-size: 10px; color: #888; }

.footer-designed {
  font-size: 12px;
  color: #555;
  line-height: 1.4;
}

.footer-designed a { color: #2196f3; }
.footer-designed a:hover { text-decoration: underline; }
</style>
</head>
